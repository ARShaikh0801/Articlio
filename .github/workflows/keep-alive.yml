name: Keep Articlio Alive

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Articlio health endpoint
        run: 'curl -s -o /dev/null -w "Status: %{http_code}\n" https://articlio.onrender.com/health/'