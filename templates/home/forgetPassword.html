{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="{% static 'img/IMG_20260517_105024.png-removebg-preview.png' %}">
    <meta name="description" content="Articlio Blog - Verify your email to complete the registration process and access all features.">
    <title>Articlio | Reset Password</title>
    <meta name="csrf-token" content="{{ csrf_token }}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Pacifico&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/output.css' %}">
    <style>
        * { font-family: 'Inter', system-ui, sans-serif; }
    </style>
</head>

<body class="theme-base-faded">

<div class="max-w-xl mx-auto px-4 py-12">

    {% for message in messages %}
    <div class="my-3 p-4 rounded-lg flex justify-between
        {% if message.tags == 'success' %}bg-green-200 text-green-700{% endif %}
        {% if message.tags == 'danger' %}bg-red-200 text-red-700{% endif %}
        {% if message.tags == 'warning' %}bg-yellow-200 text-yellow-700{% endif %}">
        {{ message }}
        <button type="button" class="close-msg text-xl">&times;</button>
    </div>
    {% endfor %}
<main>
    <div class="text-center mb-8">
        <h2 class="text-3xl font-bold text-color-darkest">
            Reset Your Password
        </h2>
        <p class="text-color-darkest mt-2">
            We will send a verification code to your email
        </p>
    </div>

    <div class="theme-dark all-border hover-card-shadow transition rounded-xl p-8">

        <form method="post" action="{% url 'resetPassword' %}" class="space-y-6">
            {% csrf_token %}


            <div>
                <label class="block text-color-lightest font-medium mb-1">
                    Username
                </label>
                <input type="text" aria-label="username" name="username"
                       class="w-full rounded-lg theme-dark all-border text-color-lightest input-box px-4 py-2 " {% if username %}value="{{username}}" readonly{% endif %}
                       required>
            </div>
            <div>
                <label class="block text-color-lightest font-medium mb-1">
                    Email
                </label>
                <input type="email" aria-label="email" name="email" {% if email %}value="{{email}}" readonly{% endif %}
                       class="w-full rounded-lg theme-dark all-border text-color-lightest input-box px-4 py-2 " required>
            </div>

            {% if step == "verify" %}
            <div>
                <label for="emailcode" class="block text-color-lightest font-medium mb-1">
                    Verification Code
                </label>
                <input type="text" aria-label="emailcode"
                       id="emailcode"
                       name="emailcode"
                       class="w-full rounded-lg theme-dark all-border text-color-lightest px-4 py-2 input-box focus:outline-none"
                       placeholder="Enter the code sent to your email"
                       required>
            </div>
            <div>
                <label for="pass1" class="block text-color-lightest font-medium mb-1">
                    Set New Password
                </label>
                <input type="password" aria-label="password"
                       id="pass1"
                       name="pass1"
                       class="w-full rounded-lg theme-dark all-border text-color-lightest px-4 py-2 input-box focus:outline-none"
                       placeholder="Enter New Password"
                       required>
            </div>
            <div>
                <label for="pass2" class="block text-color-lightest font-medium mb-1">
                    Confirm Password
                </label>
                <input type="password" aria-label="password"
                       id="pass2"
                       name="pass2"
                       class="w-full rounded-lg theme-dark all-border text-color-lightest px-4 py-2 input-box focus:outline-none"
                       placeholder="Re-enter Password"
                       required>
            </div>
            
            {% endif %}

            <div class="text-center">
                {% if step == "verify" %}

                    <button type="submit" aria-label="verify email button"
                        class="theme-medium theme-medium-btn all-border text-color-lightest px-8 py-3 rounded-lg font-medium transition">
                        Verify Email And Reset Password
                    </button>
                {% else %}
                    <button type="submit" aria-label="send verification code button"
                        class="theme-medium theme-medium-btn all-border text-color-lightest px-8 py-3 rounded-lg font-medium transition">
                        Send Verification Code
                    </button>
                {% endif %}
            </div>

        </form>

    </div>
    </main>
</div>
<script nonce="{{ request.csp_nonce }}">
        window.CURRENT_USER = "{{ request.user.username }}";
        window.USER_IS_AUTHENTICATED = {{ user.is_authenticated|yesno:'true,false' }};
        window.DB_THEME = "{% if user.is_authenticated %}{{ user.theme_preference }}{% endif %}";
        window.CSRF_TOKEN = document.querySelector('meta[name="csrf-token"]').getAttribute('content');
    </script>
    <script defer nonce="{{ request.csp_nonce }}" src="{% static 'js/colorPicker.js' %}"></script>
<script nonce="{{ request.csp_nonce }}">
    document.querySelectorAll('.close-msg').forEach(button => {
        button.addEventListener('click', () => {
            button.parentElement.remove();
        });
    });
</script>
</body>
</html>
