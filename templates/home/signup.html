{% load static %}
{% load socialaccount %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="{% static 'img/articlio logo.png' %}">
    <meta name="description" content="Articlio Blog - Sign up to create an account and join our community.">
    <title>Articlio-SignUp</title>
    <meta name="csrf-token" content="{{ csrf_token }}">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Pacifico&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/output.css' %}">
    <style>
        * { font-family: 'Inter', system-ui, sans-serif; }
    </style>
</head>

<body class="theme-base-faded">
    <div class="max-w-xl mx-auto px-4 py-12">

        {% for message in messages %}
        <div class="max-w-4xl mx-auto my-3 px-4">
            <div class="p-4 rounded-lg flex justify-between
            {% if message.tags == 'success' %}bg-green-200 text-green-700{% endif %}
            {% if message.tags == 'danger' %}bg-red-200 text-red-700{% endif %}
            {% if message.tags == 'warning' %}bg-yellow-200 text-yellow-700{% endif %}">
                {{ message }}
                <button type="button" class="close-msg text-xl">&times;</button>
            </div>
        </div>

        {% endfor %}
        <main>
        <div class="text-center mb-10">
            <h2 class="text-3xl font-bold text-color-darkest">
                Sign Up
            </h2>
            <p class="text-color-darkest mt-3">
                Already have an account? <a href="/login" class="underline">Log In</a>
            </p>
        </div>

        <div class="theme-dark all-border hover-card-shadow transition rounded-xl p-8">
            <div class="mb-6 space-y-3">
                <a href="{% provider_login_url 'google' %}" class="w-full flex items-center justify-center gap-2 theme-dark all-border text-color-lightest px-4 py-2 rounded-lg font-medium transition hover:opacity-80">
                    <svg class="w-5 h-5" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
                    Sign Up with Google
                </a>
                <a href="{% provider_login_url 'github' %}" class="w-full flex items-center justify-center gap-2 theme-dark all-border text-color-lightest px-4 py-2 rounded-lg font-medium transition hover:opacity-80">
                    <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path fill-rule="evenodd" d="M12 2C6.477 2 2 6.484 2 12.017c0 4.425 2.865 8.18 6.839 9.504.5.092.682-.217.682-.483 0-.237-.008-.868-.013-1.703-2.782.605-3.369-1.343-3.369-1.343-.454-1.158-1.11-1.466-1.11-1.466-.908-.62.069-.608.069-.608 1.003.07 1.531 1.032 1.531 1.032.892 1.53 2.341 1.088 2.91.832.092-.647.35-1.088.636-1.338-2.22-.253-4.555-1.113-4.555-4.951 0-1.093.39-1.988 1.029-2.688-.103-.253-.446-1.272.098-2.65 0 0 .84-.27 2.75 1.026A9.564 9.564 0 0112 6.844c.85.004 1.705.115 2.504.337 1.909-1.296 2.747-1.027 2.747-1.027.546 1.379.202 2.398.1 2.651.64.7 1.028 1.595 1.028 2.688 0 3.848-2.339 4.695-4.566 4.943.359.309.678.92.678 1.855 0 1.338-.012 2.419-.012 2.747 0 .268.18.58.688.482A10.019 10.019 0 0022 12.017C22 6.484 17.522 2 12 2z" clip-rule="evenodd" /></svg>
                    Sign Up with GitHub
                </a>
                <a href="{% provider_login_url 'facebook' %}" class="w-full flex items-center justify-center gap-2 theme-dark all-border text-color-lightest px-4 py-2 rounded-lg font-medium transition hover:opacity-80">
                    <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M22.675 0h-21.35c-.732 0-1.325.593-1.325 1.325v21.351c0 .731.593 1.324 1.325 1.324h11.495v-9.294h-3.128v-3.622h3.128v-2.671c0-3.1 1.893-4.788 4.659-4.788 1.325 0 2.463.099 2.795.143v3.24l-1.918.001c-1.504 0-1.795.715-1.795 1.763v2.313h3.587l-.467 3.622h-3.12v9.293h6.116c.73 0 1.323-.593 1.323-1.325v-21.35c0-.732-.593-1.325-1.325-1.325z"/></svg>
                    Sign Up with Facebook
                </a>
            </div>
            <div class="flex items-center my-6">
                <div class="flex-grow border-t border-gray-600"></div>
                <span class="mx-4 text-color-lightest text-sm uppercase">Or</span>
                <div class="flex-grow border-t border-gray-600"></div>
            </div>
            <form action="/signup" method="post" id="signupForm" class="space-y-6">
                {% csrf_token %}
                <input type="hidden" name="next" value="{{ request.GET.next }}">
                <input type="hidden" name="verified" id="verified">
                <div>
                    <label for="username" class="block text-color-lightest font-medium mb-1">
                        Username
                    </label>
                    <input type="text" id="username" name="username"
                        class="w-full rounded-lg theme-dark all-border text-color-lightest px-4 py-2 focus:outline-none input-box"
                        placeholder="Enter Username" required>
                </div>
                <div>
                    <label for="name" class="block text-color-lightest font-medium mb-1">
                        Name
                    </label>
                    <input type="text" id="name" name="name"
                        class="w-full rounded-lg theme-dark all-border text-color-lightest px-4 py-2 focus:outline-none input-box"
                        placeholder="Enter Your Name" required>
                </div>

                <div>
                    <label for="email" class="block text-color-lightest font-medium mb-1">
                        Email address
                    </label>
                    <input type="email" id="email" name="email"
                        class="w-full rounded-lg theme-dark all-border text-color-lightest px-4 py-2 focus:outline-none input-box"
                        placeholder="you@example.com" required>
                </div>
                <div>
                    <label for="role" class="block text-color-lightest font-medium mb-1">Role</label>
                    <select id="role" name="role"
                        class="w-full rounded-lg theme-dark all-border text-color-lightest px-4 py-2 focus:outline-none input-box">
                        <option value="reader" selected>Reader</option>
                        <option value="author">Author</option>
                    </select>
                    <p class="text-color-lightest mt-3 note"></p>
                </div>
                <div>
                    <label for="pass1" class="block text-color-lightest font-medium mb-1">
                        Password
                    </label>
                    <input type="password" id="pass1" name="pass1"
                        class="w-full rounded-lg theme-dark all-border text-color-lightest px-4 py-2 focus:outline-none input-box"
                        placeholder="Select Strong Password" required>
                    <div class="mt-2 py-3 px-2 rounded-lg" id="strength" style="display: none;">

                    </div>
                </div>
                <div>
                    <label for="pass2" class="block text-color-lightest font-medium mb-1">
                        Again Enter Your Password
                    </label>
                    <input type="password" id="pass2" name="pass2"
                        class="w-full rounded-lg theme-dark all-border text-color-lightest px-4 py-2 focus:outline-none input-box"
                        placeholder="Re-enter Password" required>
                    <ul style="display: none;" class="my-2 bg-red-100 p-2 rounded-lg" id="confpass">
                    </ul>
                </div>
                <div class="text-center">
                    <label class="inline-flex items-center text-color-lightest">
                        <input type="checkbox" class="form-checkbox h-5 w-5 text-blue-600" name="terms" value="true" required>
                        <span class="ml-2">I agree to the <a href="/terms" class="underline">Terms and Conditions</a></span>
                    </label>
                </div>
                <div class="text-center">
                    <label class="inline-flex items-center text-color-lightest">
                        <input type="checkbox" class="form-checkbox h-5 w-5 text-blue-600" name="privacy" value="true" required>
                        <span class="ml-2">I agree with <a href="/privacy" class="underline">Privacy Policy</a></span>
                    </label>
                </div>
                <div class="text-center">
                    <button disabled type="submit" class="px-8 py-3 all-border flex items-center rounded-lg font-medium transition bg-gray-400 hover:bg-gray-500 text-gray-200 cursor-not-allowed opacity-60" id="signup-btn">
                        <span id="signup-text">Sign Up</span>
                        <svg id="signup-spinner" class="w-4 h-4 animate-spin hidden" viewBox="0 0 24 24" fill="none">
                            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4" />
                            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v4a4 4 0 00-4 4H4z" />
                        </svg>
                    </button>
                </div>
            </form>
        </div>
        </main>

    </div>
    <script nonce="{{ request.csp_nonce }}">
        window.CURRENT_USER = "{{ request.user.username }}";
        window.USER_IS_AUTHENTICATED = {{ user.is_authenticated|yesno:'true,false' }};
        window.DB_THEME = "{% if user.is_authenticated %}{{ user.theme_preference }}{% endif %}";
        window.CSRF_TOKEN = document.querySelector('meta[name="csrf-token"]').getAttribute('content');
    </script>
    <script defer nonce="{{ request.csp_nonce }}" src="{% static 'js/colorPicker.js' %}"></script>
    <script nonce="{{ request.csp_nonce }}">
        document.querySelectorAll('.close-msg').forEach(button => {
            button.addEventListener('click', () => {
                button.parentElement.remove();
            });
        });

        let selectedRole = document.getElementById('role')
        document.getElementById('verified').value='True'
        selectedRole.addEventListener('change', () => {
            const selectedRoleValue = selectedRole.value;
            const note = document.querySelector('.note');
            if (selectedRoleValue === 'author') {
                note.textContent = "Note: Author Needs Email verification before posting blogs";
                document.getElementById('verified').value='False'
            }
            else {
                note.textContent = "";
                document.getElementById('verified').value='True'
            }
        });

        const passInput = document.getElementById('pass1')
        const passInput2 = document.getElementById('pass2')
        const strength = document.getElementById('strength')
        const signupBtn=document.getElementById('signup-btn')

        passInput.addEventListener("input", function () {
            const value = passInput.value;
            const onlyLettersLower = /^[a-z]+$/;
            const onlyLettersUpper = /^[A-Z]+$/;
            const onlyNumbers = /^\d+$/;
            const onlySpecial = /^[\W_]+$/;
            const hasLower = /[a-z]/;
            const hasUpper = /[A-Z]/;
            const hasNumber = /\d/;
            const hasSpecial = /[\W_]/;

            if (value.length === 0) {
                strength.style.display = "none";
                strength.textContent = "";
                strength.classList.remove("bg-red-100", "text-red-700", "bg-yellow-100", "text-yellow-700", "bg-green-100", "text-green-700");
                return;
            }
            strength.style.display = "block";
            strength.classList.remove("bg-red-100", "text-red-700", "bg-yellow-100", "text-yellow-700", "bg-green-100", "text-green-700");

            const hasLowerCase = hasLower.test(value);
            const hasUpperCase = hasUpper.test(value);
            const hasNumeric = hasNumber.test(value);
            const hasSpecialChar = hasSpecial.test(value);
            const charTypeCount = hasLowerCase + hasUpperCase + hasNumeric + hasSpecialChar;

            if (
                onlyLettersLower.test(value) ||
                onlyLettersUpper.test(value) ||
                onlyNumbers.test(value) ||
                onlySpecial.test(value)
            ) {
                strength.textContent = "Weak Password";
                strength.classList.add("bg-red-100");
                strength.classList.add("text-red-700");
            }
            else if (hasLowerCase && hasUpperCase && hasNumeric && hasSpecialChar) {
                strength.textContent = "Strong Password";
                strength.classList.add("bg-green-100");
                strength.classList.add("text-green-700");
            }
            else if (charTypeCount >= 2) {
                strength.textContent = "Medium Password";
                strength.classList.add("bg-yellow-100");
                strength.classList.add("text-yellow-700");
            }
            else {
                strength.style.display = "none";
                strength.textContent = "";
                strength.classList.remove("bg-red-100", "text-red-700", "bg-yellow-100", "text-yellow-700", "bg-green-100", "text-green-700");
            }
        });
        const confpass = document.getElementById('confpass')

        passInput2.addEventListener("input", function () {
            if (passInput2.value.length === 0) {
                confpass.style.display = "none";
                confpass.innerHTML = "";
                return;
            }
            confpass.style.display = "block";
            if (passInput2.value !== passInput.value) {
                confpass.style.color = "red"
                confpass.innerHTML = "<li><b>Password Is Not Matching</b></li>"
                signupBtn.disabled = true
                signupBtn.classList.add("bg-gray-400", "text-gray-200", "cursor-not-allowed", "opacity-60","hover:bg-gray-500")
                signupBtn.classList.remove("theme-medium", "theme-medium-btn", "text-color-lightest")
            }
            else {
                confpass.style.display = "none";
                confpass.innerHTML = "";
                signupBtn.disabled = false
                signupBtn.classList.remove("bg-gray-400", "text-gray-200", "cursor-not-allowed", "opacity-60","hover:bg-gray-500")
                signupBtn.classList.add("theme-medium", "theme-medium-btn", "text-color-lightest")
            }
        })

        const signupText=document.getElementById('signup-text')
        const signupSpinner=document.getElementById('signup-spinner')

        document.getElementById("signupForm").addEventListener("submit", function () {
            signupBtn.disabled = true;
            signupBtn.classList.add("opacity-80", "cursor-not-allowed");
            signupText.innerHTML = "Signing In...&nbsp;";
            signupSpinner.classList.remove("hidden");
        })
    </script>
</body>

</html>
