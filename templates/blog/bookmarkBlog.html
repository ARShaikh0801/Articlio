{% extends "base.html" %}
{% load static %}
{% block title %}Bookmarks{% endblock title %}

{% block bookmarkactive %}active-link font-semibold{% endblock bookmarkactive %}

{% block body %}

<div class="max-w-7xl mx-auto px-4 py-10" >
    <h2 class="text-3xl font-bold text-center text-color-darkest mt-5 mb-6">
        Saved Blogs
    </h2>
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6" id="bookmarks-container">
        <!-- Skeleton Loaders -->
        {% for i in "12" %}
        <div class="bg-white rounded-xl shadow-sm relative skeleton" style="border-left: 4px solid var(--theme-base); height: 280px;"></div>
        {% endfor %}
    </div>

    <div id="bookmarks-pagination-container"></div>
</div>

{% endblock body %}

{% block js %}
<script defer nonce="{{ request.csp_nonce }}" src="{% static 'js/bookmarkToggle.js' %}"></script>
<script nonce="{{ request.csp_nonce }}">
let bookmarksCurrentPage = 1;

function goToPage(page) {
    bookmarksCurrentPage = page;
    fetchBookmarks();
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

function fetchBookmarks() {
    const container = document.getElementById('bookmarks-container');
    const paginationContainer = document.getElementById('bookmarks-pagination-container');
    container.innerHTML = Array(4).fill('<div class="bg-white rounded-xl shadow-sm relative skeleton" style="border-left: 4px solid var(--theme-base); height: 280px;"></div>').join('');
    paginationContainer.innerHTML = '';

    fetch(`/blog/api/bookmarks/?page=${bookmarksCurrentPage}`)
        .then(res => res.json())
        .then(data => {
            container.innerHTML = '';
            
            if (data.posts.length === 0) {
                container.innerHTML = '<p class="text-color-darkest col-span-2 text-center font-semibold">No Saved Blogs...</p>';
                return;
            }
            
            data.posts.forEach(post => {
                const bookmarkHtml = `
                    <div class="absolute top-4 right-4 saveSVG" id="save-btn-${post.sno}" data-sno="${post.sno}">
                        ${post.bookmarked ? 
                            `<svg xmlns='http://www.w3.org/2000/svg' fill='var(--theme-darkest)' class='bi bi-bookmark-check-fill w-6 h-6 cursor-pointer' viewBox='0 0 16 16'><path fill-rule='evenodd' d='M2 15.5V2a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v13.5a.5.5 0 0 1-.74.439L8 13.069l-5.26 2.87A.5.5 0 0 1 2 15.5m8.854-9.646a.5.5 0 0 0-.708-.708L7.5 7.793 6.354 6.646a.5.5 0 1 0-.708.708l1.5 1.5a.5.5 0 0 0 .708 0z'/></svg>` 
                            : 
                            `<svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6 bi bi-bookmark cursor-pointer" fill="var(--theme-darkest)" viewBox="0 0 16 16"><path d="M2 2a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v13.5a.5.5 0 0 1-.777.416L8 13.101l-5.223 2.815A.5.5 0 0 1 2 15.5zm2-1a1 1 0 0 0-1 1v12.566l4.723-2.482a.5.5 0 0 1 .554 0L13 14.566V2a1 1 0 0 0-1-1z"/></svg>`
                        }
                    </div>`;

                const postHtml = `
                <div class="bg-white rounded-xl hover:shadow-lg transition relative fade-in" style="border-left: 4px solid var(--theme-base);">
                    <div class="p-6 flex rounded-xl flex-col h-full" style="border: 1px solid #e5e7eb; border-left: none; border-radius: 0 12px 12px 0;">
                        ${bookmarkHtml}
                        
                        <strong class="text-color-darkest mb-2" style="font-size: 0.85rem;">
                            Article by <a class="author-link-hover-medium underline" style="color: var(--theme-base);" href="/search?query=${encodeURIComponent(post.author)}">${escapeHtml(post.author)}</a> · ${escapeHtml(post.views)} views · ${escapeHtml(post.likes)} likes
                        </strong>

                        <h3 class="text-xl font-semibold mb-1">
                            <a href="/blog/${encodeURIComponent(post.slug)}" class="text-color-darkest link-hover-medium transition">
                                ${escapeHtml(post.title)}
                            </a>
                        </h3>

                        <div class="text-sm mb-3" style="color: #6b7280;">
                            Category: <a class="author-link-hover-medium underline" style="color: var(--theme-base);" href="/search?query=${encodeURIComponent(post.category)}">${escapeHtml(post.category)}</a>
                        </div>

                        <div class="text-sm mb-3" style="color: #6b7280;">
                            ${escapeHtml(post.timestamp)}
                        </div>

                        <div class="max-w-lg mb-4" style="color: #4b5563;">
                            ${escapeHtml(post.summary)}
                        </div>

                        <div class="mt-auto">
                            <a href="/blog/${encodeURIComponent(post.slug)}" aria-label="Continue reading ${escapeHtml(post.title)}"
                               class="inline-block px-5 py-2 rounded-lg transition font-medium" style="background: var(--theme-base); color: white; border: 1px solid var(--theme-base);">
                                Continue reading
                            </a>
                        </div>
                    </div>
                </div>`;
                container.insertAdjacentHTML('beforeend', postHtml);
            });

            // Render pagination
            renderPagination(paginationContainer, data.page, data.total_pages, goToPage);
        })
        .catch(err => {
            console.error(err);
            showToast('Failed to load saved blogs. Please try again.', 'error');
            container.innerHTML = '<p class="text-color-darkest col-span-2 text-center">Failed to load saved blogs.</p>';
        });
}

document.addEventListener('DOMContentLoaded', () => {
    fetchBookmarks();
});
</script>
{% endblock js %}
