{% extends "base.html" %}
{% load static %}

{% block title %}Blog Home{% endblock title %}

{% block js %}
<script defer nonce="{{ request.csp_nonce }}" src="{% static 'js/bookmarkToggle.js' %}"></script>
<script nonce="{{ request.csp_nonce }}">
document.addEventListener('DOMContentLoaded', () => {
    const filterSelect = document.getElementById('filter');
    const authorsSelect = document.getElementById('authors');
    const categorySelect = document.getElementById('category');
    const resetBtn = document.getElementById('reset-btn');
    const container = document.getElementById('posts-container');
    const paginationContainer = document.getElementById('pagination-container');

    const params = new URLSearchParams(window.location.search);
    let currentFilter = params.get('filter') || 'all';
    let currentAuthor = params.get('authors') || 'all';
    let currentCategory = params.get('category') || 'all';
    let currentPage = Math.max(1, parseInt(params.get('page')) || 1);

    function goToPage(page) {
        currentPage = page;
        fetchPosts();
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function fetchPosts() {
        container.innerHTML = Array(4).fill('<div class="bg-white rounded-xl shadow-sm relative skeleton" style="border-left: 4px solid var(--theme-base); height: 280px;"></div>').join('');
        paginationContainer.innerHTML = '';
        
        const currentParams = new URLSearchParams({
            filter: currentFilter,
            authors: currentAuthor,
            category: currentCategory,
            page: currentPage
        });

        window.history.replaceState({}, '', `${window.location.pathname}?${currentParams.toString()}`);

        if (currentFilter !== 'all' || currentAuthor !== 'all' || currentCategory !== 'all') {
            resetBtn.classList.remove('hidden');
        } else {
            resetBtn.classList.add('hidden');
        }

        fetch(`/blog/api/posts/?${currentParams.toString()}`)
            .then(res => {
                if (res.status === 429) {
                    window.location.href = '/login?next=' + encodeURIComponent(window.location.pathname + window.location.search) + '&msg=' + encodeURIComponent('You have reached the request limit. Please login to continue browsing.');
                    throw new Error("Rate limited");
                }
                if (!res.ok) {
                    throw new Error('Server error (' + res.status + ')');
                }
                return res.json();
            })
            .then(data => {
                if (authorsSelect.options.length <= 1) {
                    data.authors.forEach(author => {
                        authorsSelect.add(new Option(author, author));
                    });
                }
                authorsSelect.value = currentAuthor;
                
                if (categorySelect.options.length <= 1) {
                    data.categories.forEach(cat => {
                        categorySelect.add(new Option(cat, cat));
                    });
                }
                categorySelect.value = currentCategory;

                container.innerHTML = '';
                if (data.posts.length === 0) {
                    container.innerHTML = '<p class="text-color-darkest col-span-2">No posts found matching the criteria.</p>';
                    return;
                }

                data.posts.forEach(post => {
                const bookmarkHtml = window.USER_IS_AUTHENTICATED ? `
                        <div class="absolute top-4 right-4 saveSVG" id="save-btn-${post.sno}" data-sno="${post.sno}">
                            ${post.bookmarked ? 
                                `<svg xmlns='http://www.w3.org/2000/svg' fill='currentColor' class='bi bi-bookmark-check-fill text-color-darkest w-6 h-6 cursor-pointer' viewBox='0 0 16 16'><path fill-rule='evenodd' d='M2 15.5V2a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v13.5a.5.5 0 0 1-.74.439L8 13.069l-5.26 2.87A.5.5 0 0 1 2 15.5m8.854-9.646a.5.5 0 0 0-.708-.708L7.5 7.793 6.354 6.646a.5.5 0 1 0-.708.708l1.5 1.5a.5.5 0 0 0 .708 0z'/></svg>` 
                                : 
                                `<svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6 text-color-darkest bi bi-bookmark cursor-pointer" fill="currentColor" viewBox="0 0 16 16"><path d="M2 2a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v13.5a.5.5 0 0 1-.777.416L8 13.101l-5.223 2.815A.5.5 0 0 1 2 15.5zm2-1a1 1 0 0 0-1 1v12.566l4.723-2.482a.5.5 0 0 1 .554 0L13 14.566V2a1 1 0 0 0-1-1z"/></svg>`
                            }
                        </div>` 
                    : `
                        <a class="absolute top-4 right-4" aria-label="save button" href="/login?next=${encodeURIComponent(window.location.pathname + window.location.search)}&msg=Please+login+to+save+posts.">
                            <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6 text-color-darkest" fill="currentColor" viewBox="0 0 16 16"><path d="M2 2a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v13.5a.5.5 0 0 1-.777.416L8 13.101l-5.223 2.815A.5.5 0 0 1 2 15.5zm2-1a1 1 0 0 0-1 1v12.566l4.723-2.482a.5.5 0 0 1 .554 0L13 14.566V2a1 1 0 0 0-1-1z"/></svg>
                        </a>`;

                    const postHtml = `
                    <div class="bg-white rounded-xl hover:shadow-lg transition relative fade-in" style="border-left: 4px solid var(--theme-base);">
                        <div class="p-6 flex rounded-xl flex-col h-full" style="border: 1px solid #e5e7eb; border-left: none; border-radius: 0 12px 12px 0;">
                            ${bookmarkHtml}
                            
                            <strong class="text-color-darkest mb-2" style="font-size: 0.85rem;">
                                Article by <a class="author-link-hover-medium underline" style="color: var(--theme-base);" href="/search?query=${encodeURIComponent(post.author)}">${escapeHtml(post.author)}</a> · ${escapeHtml(post.views)} views · ${escapeHtml(post.likes)} likes
                            </strong>

                            <h3 class="text-xl font-semibold mb-1">
                                <a href="/blog/${encodeURIComponent(post.slug)}" class="text-color-darkest link-hover-medium transition">
                                    ${escapeHtml(post.title)}
                                </a>
                            </h3>

                            <div class="text-sm mb-3" style="color: #6b7280;">
                                Category: <a class="author-link-hover-medium underline" style="color: var(--theme-base);" href="/search?query=${encodeURIComponent(post.category)}">${escapeHtml(post.category)}</a>
                            </div>

                            <div class="text-sm mb-3" style="color: #6b7280;">
                                ${escapeHtml(post.timestamp)}
                            </div>

                            <div class="max-w-lg mb-4" style="color: #4b5563;">
                                ${escapeHtml(post.summary)}
                            </div>

                            <div class="mt-auto">
                                <a href="/blog/${encodeURIComponent(post.slug)}" aria-label="Continue reading ${escapeHtml(post.title)}"
                                   class="inline-block px-5 py-2 rounded-lg transition font-medium" style="background: var(--theme-base); color: white; border: 1px solid var(--theme-base);">
                                    Continue reading
                                </a>
                            </div>
                        </div>
                    </div>`;
                    container.insertAdjacentHTML('beforeend', postHtml);
                });

                // Render pagination
                renderPagination(paginationContainer, data.page, data.total_pages, goToPage);
            })
            .catch(err => {
                if (err.message === 'Rate limited') return;
                console.error(err);
                showToast('Failed to load blog posts. Please try again.', 'error');
                container.innerHTML = '<p class="text-color-darkest col-span-2">Failed to load posts.</p>';
            });
    }

    filterSelect.addEventListener('change', () => { currentFilter = filterSelect.value; currentPage = 1; fetchPosts(); });
    authorsSelect.addEventListener('change', () => { currentAuthor = authorsSelect.value; currentPage = 1; fetchPosts(); });
    categorySelect.addEventListener('change', () => { currentCategory = categorySelect.value; currentPage = 1; fetchPosts(); });

    resetBtn.addEventListener('click', () => {
        currentFilter = "all";
        currentAuthor = "all";
        currentCategory = "all";
        filterSelect.value = "all";
        authorsSelect.value = "all";
        categorySelect.value = "all";
        currentPage = 1;
        fetchPosts();
    });

    fetchPosts();
});
</script>
{% endblock js %}

{% block blogactive %}active-link font-semibold{% endblock blogactive %}

{% block body %}

<div class="max-w-7xl mx-auto px-4 py-10" >

    <form id="filter-form" class="mb-3 filter-bar">
        <select aria-label="filter" name="filter" id="filter" class="rounded-lg all-border theme-medium theme-medium-btn text-color-lightest px-4 py-2 focus:outline-none input-box">
            <option value="all">All Posts</option>
            <option value="liked">Most Liked Posts First</option>
            <option value="unliked">Least Liked Posts First</option>
            <option value="viewed">Most viewed Posts First</option>
            <option value="unviewed">Least viewed Posts First</option>
            <option value="latest">Latest First</option>
            <option value="old">Oldest First</option>
        </select>
        <select aria-label="authors Filter" name="authors" id="authors" class="rounded-lg all-border theme-medium theme-medium-btn text-color-lightest px-4 py-2 focus:outline-none input-box">
            <option value="all">All Authors</option>
        </select>
        <select aria-label="category Filter" name="category" id="category" class="rounded-lg all-border theme-medium theme-medium-btn text-color-lightest px-4 py-2 focus:outline-none input-box">
            <option value="all">All Categories</option>
        </select>
        <button title="Reset Filter button" class="theme-medium all-border theme-medium-btn text-color-lightest px-4 py-2 rounded-lg hidden" id="reset-btn" type="button">Reset</button>
    </form>
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6" id="posts-container">
        <!-- Skeleton Loaders -->
        {% for i in "1234" %}
        <div class="bg-white rounded-xl shadow-sm relative skeleton" style="border-left: 4px solid var(--theme-base); height: 280px;"></div>
        {% endfor %}
    </div>

    <div id="pagination-container"></div>

</div>

{% endblock body %}
