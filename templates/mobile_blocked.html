<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Desktop Required</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: "Segoe UI", sans-serif;
}

body {
    height: 100vh;
    background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
    display: flex;
    align-items: center;
    justify-content: center;
}

.container {
    background: white;
    padding: 35px 30px;
    border-radius: 16px;
    max-width: 420px;
    width: 90%;
    text-align: center;
    box-shadow: 0 20px 40px rgba(0,0,0,0.3);
    animation: pop 0.5s ease;
}

@keyframes pop {
    from {
        transform: scale(0.8);
        opacity: 0;
    }
    to {
        transform: scale(1);
        opacity: 1;
    }
}

.icon {
    font-size: 60px;
    margin-bottom: 15px;
}

h1 {
    font-size: 24px;
    margin-bottom: 10px;
    color: #222;
}

p {
    font-size: 15px;
    color: #555;
    line-height: 1.6;
    margin-bottom: 20px;
}

.tip {
    background: #f1f5ff;
    padding: 12px;
    border-radius: 10px;
    font-size: 14px;
    color: #333;
}

.footer {
    margin-top: 18px;
    font-size: 12px;
    color: #777;
}

</style>
</head>

<body>

<div class="container">

    <div class="icon">🖥️</div>

    <h1>Desktop Access Required</h1>

    <p>
        This website is optimized for desktop devices only.
        Please open it on a laptop or computer for the best experience.
    </p>

    <div class="tip">
        💡 Tip: Switch to "Desktop Site" mode or use a PC browser.
    </div>

    <div class="footer">
        Thank you for understanding
    </div>

</div>

</body>
</html>
