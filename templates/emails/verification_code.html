<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>
    <!--[if mso]>
    <style type="text/css">
        body, table, td, a { font-family: Arial, sans-serif !important; }
    </style>
    <![endif]-->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Pacifico&display=swap" rel="stylesheet">
    <style type="text/css">
        /* Client-specific Styles */
        body, table, td, a { -webkit-text-size-adjust: 100%; -ms-text-size-adjust: 100%; }
        table, td { mso-table-lspace: 0pt; mso-table-rspace: 0pt; }
        img { -ms-interpolation-mode: bicubic; }

        /* Reset Styles */
        img { border: 0; height: auto; line-height: 100%; outline: none; text-decoration: none; }
        table { border-collapse: collapse !important; }
        body { height: 100% !important; margin: 0 !important; padding: 0 !important; width: 100% !important; }

        /* iOS Blue Links */
        a[x-apple-data-detectors] {
            color: inherit !important;
            text-decoration: none !important;
            font-size: inherit !important;
            font-family: inherit !important;
            font-weight: inherit !important;
            line-height: inherit !important;
        }

        /* Hover Effects */
        .visit-link:hover {
            text-decoration: underline !important;
            opacity: 0.8;
        }
    </style>
</head>
<body style="background-color: {{ colors.lightest }}; font-family: 'Inter', -apple-system, system-ui, sans-serif; margin: 0; padding: 0; -webkit-font-smoothing: antialiased;">

    <!-- Wrapper Table -->
    <table border="0" cellpadding="0" cellspacing="0" width="100%" style="background-color: {{ colors.lightest }}; table-layout: fixed;">
        <tr>
            <td align="center" style="padding: 40px 16px 60px 16px;">
                
                <!-- Main Container Card -->
                <table border="0" cellpadding="0" cellspacing="0" width="100%" style="max-width: 540px; background-color: #ffffff; border: 1px solid {{ colors.light }}; border-radius: 16px; box-shadow: 0 4px 20px rgba(0, 0, 0, 0.02); overflow: hidden;">
                    
                    <!-- Decorative Top Border Theme Accent -->
                    <tr>
                        <td height="6" style="background-color: {{ colors.primary }}; line-height: 6px; font-size: 6px;">&nbsp;</td>
                    </tr>

                    <tr>
                        <td style="padding: 40px 32px 32px 32px;">
                            
                            <!-- Header / Logo -->
                            <table border="0" cellpadding="0" cellspacing="0" width="100%">
                                <tr>
                                    <td align="center" style="padding-bottom: 24px;">
                                        <a href="{{ site_url }}" target="_blank" style="text-decoration: none; display: inline-block;">
                                            <span style="font-family: 'Pacifico', cursive, Georgia, serif; font-size: 32px; color: {{ colors.primary }}; line-height: 1.2;">Articlio</span>
                                        </a>
                                    </td>
                                </tr>
                                <tr>
                                    <td align="center" style="padding-bottom: 24px;">
                                        <div style="height: 1px; background-color: {{ colors.light }}; width: 80px; line-height: 1px; font-size: 1px;">&nbsp;</div>
                                    </td>
                                </tr>
                            </table>

                            <!-- Email Body Content -->
                            <table border="0" cellpadding="0" cellspacing="0" width="100%">
                                <tr>
                                    <td align="left" style="padding-bottom: 16px;">
                                        <h1 style="margin: 0; font-size: 22px; font-weight: 700; color: {{ colors.dark }}; line-height: 1.3; text-align: center;">{{ title }}</h1>
                                    </td>
                                </tr>
                                <tr>
                                    <td align="left" style="padding-bottom: 24px; font-size: 15px; line-height: 1.6; color: {{ colors.darkest }}; text-align: center;">
                                        Hi <strong style="color: {{ colors.dark }};">{{ username }}</strong>,<br><br>
                                        {{ description }}
                                    </td>
                                </tr>

                                <!-- Code Box Container -->
                                <tr>
                                    <td align="center" style="padding-bottom: 24px;">
                                        <table border="0" cellpadding="0" cellspacing="0" style="background-color: {{ colors.lightest }}; border: 1px dashed {{ colors.medium }}; border-radius: 12px; width: 100%; max-width: 320px;">
                                            <tr>
                                                <td align="center" style="padding: 18px 24px; font-family: 'Courier New', Courier, monospace; font-size: 36px; font-weight: bold; letter-spacing: 8px; color: {{ colors.primary }}; text-align: center; line-height: 1.2;">
                                                    <span style="padding-left: 8px;">{{ code }}</span>
                                                </td>
                                            </tr>
                                        </table>
                                    </td>
                                </tr>

                                <!-- Security Disclaimer -->
                                <tr>
                                    <td align="center" style="padding-top: 8px; padding-bottom: 16px; font-size: 12px; line-height: 1.5; color: #64748b; text-align: center;">
                                        This verification code is valid for <strong>30 minutes</strong>.<br>
                                        If you did not request this email, you can safely ignore it.
                                    </td>
                                </tr>
                            </table>

                        </td>
                    </tr>

                    <!-- Footer Section -->
                    <tr>
                        <td align="center" style="padding: 24px 32px; background-color: {{ colors.lightest }}; border-top: 1px solid {{ colors.light }};">
                            <table border="0" cellpadding="0" cellspacing="0" width="100%">
                                <tr>
                                    <td align="center" style="font-size: 13px; line-height: 1.5; color: {{ colors.dark }}; padding-bottom: 8px;">
                                        &copy; 2026 Articlio. All rights reserved.
                                    </td>
                                </tr>
                                <tr>
                                    <td align="center">
                                        <a href="{{ site_url }}" target="_blank" class="visit-link" style="font-size: 13px; font-weight: 600; color: {{ colors.primary }}; text-decoration: none;">Visit Our Website</a>
                                    </td>
                                </tr>
                            </table>
                        </td>
                    </tr>

                </table>
                
            </td>
        </tr>
    </table>

</body>
</html>
